[tox]
envlist = py{38,39,310,311,312}-django{32,42,52}
skipsdist = True

[gh-actions]
python =
    3.8: py38
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312

[testenv]
setenv =
    SECRET_KEY_RAZ = test§$%§$§%
    DJANGO_SETTINGS_MODULE = ionescu77v2Project.settings.test
    DATABASE_NAME = github-actions
    DATABASE_USER = postgres
    DATABASE_PASSWORD = postgres

deps =
    django32: Django>=3.2,<3.3
    django42: Django>=4.2,<4.3
    django52: Django>=5.2,<5.3
    psycopg2-binary>=2.9.9
    factory-boy>=3.3.1
    Faker>=28.4.1
    coverage>=6.5.0
    coveralls>=4.0
    wheel>=0.44.0
    django-appconf>=1.0.6
    django32: django-axes>=5.40.1,<6.0
    django42: django-axes>=6.0,<7.0
    django52: django-axes>=7.0
    django32: django-crispy-forms>=1.14.0,<2.0
    django42: django-crispy-forms>=2.0
    django52: django-crispy-forms>=2.0
    crispy-bootstrap3
    django-ipware>=7.0.1
    certifi>=2024.8.30
    chardet>=5.2.0
    docopt>=0.6.2
    feedparser>=6.0.11
    idna
    markdown2>=2.5.0
    Pygments>=2.18.0
    python-dateutil>=2.8.2
    pytz>=2024.2
    requests
    six>=1.16.0
    text-unidecode>=1.3
    urllib3>=2.2.2

commands_pre =
    python {toxinidir}/src/manage.py migrate --noinput

commands =
    coverage run {toxinidir}/src/manage.py test blogengine accounts

passenv =
    DATABASE_NAME
    DATABASE_USER
    DATABASE_PASSWORD
    DJANGO_SETTINGS_MODULE
    SECRET_KEY_RAZ
    GITHUB_TOKEN
