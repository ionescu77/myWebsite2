# name of our workflow
name: Django CI Workflow

# triggers for our workflow
on:
  # opening a pull request to master and develop branch will be a trigger
  pull_request:
    branches:
      - develop
  # any code pushed to master and develop branch will also be a trigger
  push:
    branches:
      - develop


# job definitions
jobs:
  django-matrix-test: # Matrix testing for multiple Django versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Test Django 3.2 (current) with Python 3.8 - REQUIRED TO PASS
          - python-version: '3.8'
            django-version: 'django32'
            tox-env: 'py38-django32'
            continue-on-error: false
          # Test Django 4.2 (current LTS) with Python 3.10 - INFORMATIONAL ONLY
          - python-version: '3.10'
            django-version: 'django42'
            tox-env: 'py310-django42'
            continue-on-error: true
          # Test Django 5.2 (future LTS) with Python 3.12 - INFORMATIONAL ONLY
          - python-version: '3.12'
            django-version: 'django52'
            tox-env: 'py312-django52'
            continue-on-error: true
    continue-on-error: ${{ matrix.continue-on-error }}
    env:
      SECRET_KEY_RAZ: test§$%§$§%
      DJANGO_SETTINGS_MODULE: ionescu77v2Project.settings.test
      DATABASE_NAME: github-actions
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
    services:
      postgres:
        image: postgres:10
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: github-actions
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ matrix.django-version }}-${{ hashFiles('**/requirements/test.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ matrix.django-version }}-
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-
      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          pip install tox
      - name: Run tests with tox for Django ${{ matrix.django-version }}
        run: tox -e ${{ matrix.tox-env }}
      - name: Upload coverage to Coveralls
        if: matrix.tox-env == 'py38-django32'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install coveralls
          coveralls --service=github

  coveralls_finish:
      needs: django-matrix-test
      runs-on: ubuntu-latest
      steps:
      - name: Coveralls Finished report
        uses: AndreMiras/coveralls-python-action@develop
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel: true
          parallel-finished: true
          flag-name: github_action_tests
          base-path: '.'
          debug: true
